<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat - Sign in</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">
    <main class="auth-card">
        <h1>Chat</h1>

        <div class="tabs">
            <button type="button" class="tab active" data-form="login-form">Log in</button>
            <button type="button" class="tab" data-form="register-form">Register</button>
        </div>

        <p class="error" id="error" hidden></p>
        <p class="info" id="info" hidden></p>

        <form id="login-form">
            <label>Username or email
                <input type="text" name="login" required>
            </label>
            <label>Password
                <input type="password" name="password" required>
            </label>
            <button type="submit">Log in</button>
        </form>

        <form id="register-form" hidden>
            <label>Username
                <input type="text" name="username" required>
            </label>
            <label>Display name
                <input type="text" name="display_name" maxlength="50" placeholder="Optional">
            </label>
            <label>Email
                <input type="email" name="email" required>
            </label>
            <label>Password
                <input type="password" id="password1" name="password" required>
            </label>
            <ul id="pwd-rules">
                <li id="rule-length">At least 8 characters</li>
                <li id="rule-upper">One capital letter</li>
                <li id="rule-number">One number</li>
            </ul>

            <label>Repeat password
                <input type="password" id="password2" required>
            </label>
            <p id="pwd-match"></p>
            <button type="submit">Create account</button>
        </form>
        <form id="verify-form" hidden>
            <label>Verification code
                <input type="text" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
            </label>
            <button type="submit">Verify</button>
            <button type="button" id="resend">Send a new code</button>
        </form>
        <form id="totp-setup-form" hidden>
            <p class="hint">Scan this QR code with Google Authenticator, then enter the 6-digit code it shows.</p>
            <div id="totp-qr"></div>
            <p class="hint">Can't scan? Enter this key in the app instead:</p>
            <p id="totp-secret"></p>
            <label>Code from the app
                <input type="text" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
            </label>
            <button type="submit">Confirm</button>
        </form>

        <form id="totp-form" hidden>
            <p class="hint">Enter the 6-digit code from Google Authenticator.</p>
            <label>Authenticator code
                <input type="text" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required>
            </label>
            <button type="submit">Log in</button>
        </form>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
